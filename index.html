<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legare Family Calendar</title>
<style>
:root{--bg:#12131c;--card:#1c1d2b;--cell:#171826;--ink:#f1f1f8;--mute:#9a9ab0;--line:#2c2c40;--edge:#8e91b8;--a:#6366f1;--b:#ec4899}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,select{font:inherit;color:inherit}
header{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;height:48px}
header h1{font-size:17px;margin:0;flex:1}
body.embed header{display:none}
#app{height:calc(100% - 48px)}body.embed #app{height:100%}
.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;color-scheme:dark}
.mute{color:var(--mute);font-size:12.5px}
.card{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--line)}
#login{max-width:520px;margin:40px auto;text-align:center}.err{color:#f87171;font-size:14px;margin-top:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.wrap{display:flex;flex-direction:column;height:100%}
.cal-top{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.cal-top h2{margin:0 6px 0 0;font-size:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 11px;border-radius:999px;font-size:12px;cursor:pointer}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}.pill.off{opacity:.4;text-decoration:line-through}
.cal-end{margin-left:auto;display:flex;gap:8px;align-items:center}
.cal-layout{display:flex;gap:18px;flex:1;min-height:0;padding:0 14px 14px}
.cal-scroll{flex:1;min-width:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3a3c58 transparent;border-radius:12px;border:1px solid var(--line);background:var(--cell);position:relative}
.cal-heads{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));background:var(--card);border-bottom:1px solid var(--line)}
.cal-head{padding:8px;font-size:12px;color:var(--mute)}.cal-head.is-today{color:#fff;font-weight:700}
.cal-month{display:grid;grid-template-columns:34px minmax(0,1fr);border-bottom:2px solid var(--edge)}
.cal-bar{background:var(--a);color:#fff;position:relative}.cal-month.odd .cal-bar{background:#a855f7}
.cal-bar-label{position:sticky;top:42px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:700;padding:10px 0 10px 0;display:inline-block;margin-left:8px;letter-spacing:.3px;white-space:nowrap}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-cell{min-height:104px;padding:6px;background:var(--cell);border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0;transition:background .15s}
.cal-cell:hover{background:#1f2034}.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-cell.is-today{background:var(--b)}.cal-cell.is-today .daynum{color:#fff}
.cal-cell.et{border-top:2px solid var(--edge)}.cal-cell.el{border-left:2px solid var(--edge)}
.daynum{font-size:13px;font-weight:600}.daynum.first{font-weight:800}
.cal-chip{font-size:11px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 28%,#12131c);border-left:3px solid var(--c);color:#fff}
.is-today .cal-chip{background:rgba(0,0,0,.28)}
.cal-more{font-size:11px;color:var(--mute)}
.cal-sidebar{width:300px;flex:none;align-self:flex-start;position:sticky;top:0;max-height:100%;overflow:auto}
.cal-side-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.cal-side-heading b{font-size:16px;line-height:1.3}
.sev{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}.sev:last-child{border:0}
.sev .dot{width:4px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}.sev .x{margin-left:auto;display:flex;gap:4px}
.sev .x button{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 7px;cursor:pointer;color:var(--mute);font-size:12px}
.addf{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.addf input,.addf select{width:100%;margin-bottom:8px}
@media(max-width:900px){.cal-layout{flex-direction:column;overflow-y:auto}.cal-scroll{flex:none;height:70vh}.cal-sidebar{width:100%;position:static}.cal-cell{min-height:64px}.cal-chip{font-size:9.5px}}
</style>
</head>
<body>
<header><h1>Legare Family Calendar</h1><span class="who" id="who"></span><button class="btn alt" id="signout" hidden>Sign out</button></header>
<main id="app"></main>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
'use strict';
const CLIENT_ID='1089767880251-35h0cok3bdg9qi3hr59sqjnajd7cdo2t.apps.googleusercontent.com';
const CAL_NAME='Legare Family';
const DEMO=location.search.includes('demo=1');
const EMBED=window.parent!==window;if(EMBED)document.body.classList.add('embed');
const TZ='America/New_York';
const KINDS={School:['\u{1F392}','#6366f1'],Family:['\u{1F46A}','#ec4899'],Church:['\u26EA','#a855f7'],Appointment:['\u{1F4CC}','#f59e0b'],Bill:['\u{1F4B8}','#64748b'],Other:['\u2728','#10b981']};
const DINNER={0:"Dinner at Andrew's parents (bring a dish)",1:'Meatballs or Philly cheesesteaks',2:'Sausage & peppers with rice',3:'Chicken strips & mac and cheese',4:'Soup',5:'Pizza',6:'Nice dinner (Saturday special)'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let token=null,tokenExp=0,calId=null,me='',events=[],err='',busy=false,adding=false;
let sel=iso(new Date());
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let hidden=new Set(store.get('fc.hidden')||[]);

/* ---------- Google API layer ---------- */
async function g(path,opt={}){
  if(DEMO)return demoApi(path,opt);
  if(Date.now()>tokenExp-60000)await getToken(false);
  const r=await fetch('https://www.googleapis.com/calendar/v3'+path,{method:opt.method||'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){await getToken(false);return g(path,opt)}
  if(r.status===204)return null;
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error&&j.error.message||('Google error '+r.status));return j;
}
let tc=null;
function getToken(interactive){
  return new Promise((res,rej)=>{
    if(!window.google||!google.accounts){return rej(new Error('Google sign-in is still loading — try again in a second.'))}
    tc=tc||google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/userinfo.email',callback:()=>{}});
    tc.callback=r=>{if(r.error)return rej(new Error(r.error_description||r.error));token=r.access_token;tokenExp=Date.now()+(+r.expires_in||3600)*1000;store.set('fc.tok',{token,tokenExp});res()};
    tc.error_callback=e=>rej(new Error(e.message||e.type||'Sign-in cancelled'));
    tc.requestAccessToken({prompt:interactive?'consent select_account':'',login_hint:store.get('fc.email')||undefined});
  });
}

/* ---------- calendar bootstrap ---------- */
async function findCal(){
  const l=await g('/users/me/calendarList?minAccessRole=writer&maxResults=250');
  return (l.items||[]).find(c=>c.summary===CAL_NAME);
}
async function bootstrap(){
  let c=await findCal();
  me=(await g('/calendars/primary')).id||'';store.set('fc.email',me);
  if(!c){
    const partner=(store.get('fc.partner')||'').trim();
    if(!partner)throw new Error('SETUP: first sign-in — type your spouse\'s Gmail address below, then sign in again. (If your spouse already set this up, ask them to share the "'+CAL_NAME+'" calendar with you.)');
    c=await g('/calendars',{method:'POST',body:{summary:CAL_NAME,description:'Shared family calendar — managed by the Legare Family Calendar site',timeZone:TZ}});
    await g('/calendars/'+encodeURIComponent(c.id)+'/acl?sendNotifications=false',{method:'POST',body:{role:'writer',scope:{type:'user',value:partner}}});
    await seedRecurring(c.id);
  }
  calId=c.id;
}
function nextDow(dow){const d=new Date();while(d.getDay()!==dow)d.setDate(d.getDate()+1);return iso(d)}
function addDay(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)}
async function seedRecurring(id){
  const mk=(title,dow,byday,kind)=>{const s=nextDow(dow);return {summary:KINDS[kind][0]+' '+title,start:{date:s},end:{date:addDay(s,1)},recurrence:['RRULE:FREQ=WEEKLY;BYDAY='+byday],extendedProperties:{private:{kind}}}};
  const p='/calendars/'+encodeURIComponent(id)+'/events';
  await g(p,{method:'POST',body:mk('School / co-op day',1,'MO,WE','School')});
  // BYDAY MO,WE: first occurrence must be Mon; Wednesday follows via RRULE
  await g(p,{method:'POST',body:mk("Dinner at Andrew's parents",0,'SU','Family')});
}

/* ---------- events ---------- */
function range(){const t=new Date(),a=new Date(t.getFullYear(),t.getMonth()-1,1);a.setDate(a.getDate()-a.getDay());const z=new Date(t.getFullYear(),t.getMonth()+13,0);z.setDate(z.getDate()+(6-z.getDay()));return [a,z]}
async function load(){
  if(!calId)return;
  const [a,z]=range(),b=new Date(z);b.setDate(b.getDate()+1);
  const q='?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin='+encodeURIComponent(a.toISOString())+'&timeMax='+encodeURIComponent(b.toISOString());
  const r=await g('/calendars/'+encodeURIComponent(calId)+'/events'+q);
  events=(r.items||[]).filter(e=>e.status!=='cancelled');
}
const evDate=e=>(e.start.date||e.start.dateTime.slice(0,10));
const evTime=e=>e.start.dateTime?new Date(e.start.dateTime).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
function kindOf(e){const k=e.extendedProperties&&e.extendedProperties.private&&e.extendedProperties.private.kind;if(k&&KINDS[k])return k;
  const t=e.summary||'';for(const [n,[em]] of Object.entries(KINDS))if(t.startsWith(em))return n;return 'Other'}
const dayEvents=k=>events.filter(e=>{const s=evDate(e);if(e.start.date)return k>=s&&k<(e.end.date||addDay(s,1));return s===k}).filter(e=>!hidden.has(kindOf(e))).sort((a,b)=>(a.start.dateTime?1:0)-(b.start.dateTime?1:0)||String(a.start.dateTime).localeCompare(String(b.start.dateTime)));
const title=e=>(e.summary||'').replace(/^[^\w(]+\s*/u,'');

/* ---------- UI ---------- */
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
function gridHtml(){
  const [a,z]=range(),tk=iso(new Date());let out='',w=new Date(a),blocks=[],cur=null;
  while(w<=z){const sat=new Date(w);sat.setDate(sat.getDate()+6);const key=sat.getFullYear()+'-'+sat.getMonth();
    if(!cur||cur.key!==key){cur={key,y:sat.getFullYear(),m:sat.getMonth(),weeks:[]};blocks.push(cur)}
    cur.weeks.push(new Date(w));w=new Date(w);w.setDate(w.getDate()+7)}
  blocks.forEach((b,bi)=>{
    out+=`<div class="cal-month ${bi%2?'odd':''}" data-m="${b.y}-${b.m+1}"><div class="cal-bar"><span class="cal-bar-label">${MON[b.m]} ${b.y}</span></div><div>`;
    b.weeks.forEach(ws=>{out+='<div class="cal-week">';for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);const k=iso(d),up=new Date(d);up.setDate(d.getDate()-7);const pv=new Date(d);pv.setDate(d.getDate()-1);
      const et=up.getMonth()!==d.getMonth()&&bi>0,el=i>0&&pv.getMonth()!==d.getMonth();
      const ev=dayEvents(k),lab=d.getDate()===1?MON[d.getMonth()].slice(0,3)+' 1':d.getDate();
      out+=`<button class="cal-cell ${k===tk?'is-today':''} ${k===sel?'sel':''} ${et?'et':''} ${el?'el':''}" data-day="${k}"><span class="daynum ${d.getDate()===1?'first':''}">${lab}</span>${ev.slice(0,3).map(e=>`<span class="cal-chip" style="--c:${KINDS[kindOf(e)][1]}">${evTime(e)?esc(evTime(e).replace(' ','').toLowerCase().replace(':00',''))+' ':''}${esc(title(e))}</span>`).join('')}${ev.length>3?`<span class="cal-more">+${ev.length-3} more</span>`:''}</button>`}
      out+='</div>'});
    out+='</div></div>'});
  return out;
}
function sideHtml(){
  const sev=dayEvents(sel),d=new Date(sel+'T12:00');
  return `<div class="cal-side-heading"><b>${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</b><button class="btn" id="addtoggle">${adding?'Close':'+ Add event'}</button></div>
  <div style="margin-top:10px">${sev.map(e=>{const k=kindOf(e);return `<div class="sev" style="--c:${KINDS[k][1]}"><span class="dot"></span><span><b>${esc(title(e))}</b><br><span class="mute">${k}${evTime(e)?' \u00b7 '+evTime(e):''}${e.recurringEventId?' \u00b7 repeats':''}</span></span><span class="x"><button data-del="${e.id}" title="Delete this one">\u2715</button>${e.recurringEventId?`<button data-delall="${e.recurringEventId}" title="Delete the whole series">all</button>`:''}</span></div>`}).join('')||'<p class="mute" style="text-align:center;margin:18px 0">Nothing on this day.</p>'}</div>
  <p class="mute">Dinner plan: <b style="color:var(--ink)">${esc(DINNER[d.getDay()])}</b></p>
  ${adding?`<div class="addf"><input id="cti" placeholder="What's happening?"><input id="cd" type="date" value="${sel}"><input id="ct" type="time"><select id="ck">${Object.keys(KINDS).filter(k=>k!=='Bill').map(k=>`<option>${k}</option>`).join('')}</select><select id="cr"><option value="">Just once</option><option value="WEEKLY">Every week</option><option value="MONTHLY">Every month</option></select><button class="btn" id="cadd" style="width:100%">Add</button></div>`:''}`;
}
function render(keep){
  const app=$('#app');$('#who').textContent=me?('Signed in as '+me):'';$('#signout').hidden=!token&&!DEMO;
  if(!calId){
    app.innerHTML=`<div class="card" id="login"><h2>Sign in with Google to open the family calendar</h2><p class="mute">Everything lives in a shared Google Calendar called \u201c${CAL_NAME}\u201d, so it also shows up in your own Google Calendar app.</p>
    <div class="row" style="justify-content:center"><input id="partner" type="email" placeholder="Spouse's Gmail (first-time setup only)" value="${esc(store.get('fc.partner')||'')}" style="min-width:260px"></div>
    <button class="btn" id="signin" ${busy?'disabled':''}>${busy?'Signing in\u2026':'Sign in with Google'}</button><div class="err">${esc(err)}</div></div>`;return;
  }
  const old=$('.cal-scroll'),st=old?old.scrollTop:null;
  app.innerHTML=`<div class="wrap"><div class="cal-top"><h2>Calendar</h2>${Object.keys(KINDS).filter(k=>k!=='Bill').map(k=>`<button class="pill ${hidden.has(k)?'off':''}" data-kind="${k}" style="--c:${KINDS[k][1]}"><i></i>${k}</button>`).join('')}
   <span class="cal-end"><span class="mute">${err?esc(err):'In sync with Google Calendar'}</span><button class="btn alt" id="today">Today</button><button class="btn alt" id="refresh">\u21bb</button>${EMBED?(token||DEMO?'<button class="btn alt" id="signout2">Sign out</button>':''):''}</span></div>
   <div class="cal-layout"><div class="cal-scroll" id="scroller"><div class="cal-heads"><span></span>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((n,i)=>`<div class="cal-head ${i===new Date().getDay()?'is-today':''}">${n}</div>`).join('')}</div><div id="gridbox">${gridHtml()}</div></div>
   <aside class="cal-sidebar card" id="side">${sideHtml()}</aside></div></div>`;
  const sc=$('#scroller');if(st!==null&&keep)sc.scrollTop=st;else toToday();
}
function toToday(){const sc=$('#scroller'),c=sc&&sc.querySelector('.cal-cell.is-today');if(c){sc.scrollTop+=c.getBoundingClientRect().top-sc.getBoundingClientRect().top-36-104}}
function paintSide(){$('#side').innerHTML=sideHtml();document.querySelectorAll('.cal-cell.sel').forEach(c=>c.classList.remove('sel'));const c=document.querySelector('[data-day="'+sel+'"]');if(c)c.classList.add('sel')}
async function refresh(){try{err='';await load()}catch(e){err=e.message}render(true)}
async function addEvent(){
  const ti=$('#cti').value.trim(),dt=$('#cd').value,tm=$('#ct').value,kind=$('#ck').value,rep=$('#cr').value;if(!ti||!dt)return;
  const body={summary:KINDS[kind][0]+' '+ti,extendedProperties:{private:{kind}}};
  if(tm){const s=new Date(dt+'T'+tm),e=new Date(s.getTime()+3600000);body.start={dateTime:s.toISOString(),timeZone:TZ};body.end={dateTime:e.toISOString(),timeZone:TZ}}
  else{body.start={date:dt};body.end={date:addDay(dt,1)}}
  if(rep)body.recurrence=['RRULE:FREQ='+rep];
  try{await g('/calendars/'+encodeURIComponent(calId)+'/events',{method:'POST',body});sel=dt;adding=false;await refresh()}catch(e){err=e.message;render(true)}
}
async function del(id){try{await g('/calendars/'+encodeURIComponent(calId)+'/events/'+encodeURIComponent(id),{method:'DELETE'});await refresh()}catch(e){err=e.message;render(true)}}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='signin'){const pe=$('#partner');if(pe&&pe.value.trim())store.set('fc.partner',pe.value.trim());busy=true;err='';render();try{if(CLIENT_ID.startsWith('__'))throw new Error('This site is not connected to Google yet (missing client ID).');await getToken(true);await bootstrap();await load()}catch(x){err=x.message;calId=null}busy=false;render()}
  else if(t.id==='signout'||t.id==='signout2'){if(token&&window.google)google.accounts.oauth2.revoke(token,()=>{});token=null;calId=null;events=[];store.set('fc.tok',null);render()}
  else if(t.dataset.day){sel=t.dataset.day;paintSide()}
  else if(t.dataset.kind){const k=t.dataset.kind;hidden.has(k)?hidden.delete(k):hidden.add(k);store.set('fc.hidden',[...hidden]);render(true)}
  else if(t.id==='today'){sel=iso(new Date());render(false)}
  else if(t.id==='refresh')await refresh();
  else if(t.id==='addtoggle'){adding=!adding;paintSide()}
  else if(t.id==='cadd')await addEvent();
  else if(t.dataset.del)await del(t.dataset.del);
  else if(t.dataset.delall)await del(t.dataset.delall);
});
setInterval(()=>{if(calId&&!document.hidden)refresh()},180000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&calId)refresh()});

/* ---------- demo mode (?demo=1): fake Google, for previewing the layout ---------- */
let demoEv=[];
async function demoApi(path,opt){
  if(path.includes('/events')&&(opt.method||'GET')==='GET'){
    const out=[];const a=new Date();a.setMonth(a.getMonth()-1);for(let i=0;i<90;i++){const d=new Date(a);d.setDate(a.getDate()+i);const k=iso(d),w=d.getDay();
      if(w===1||w===3)out.push({id:'s'+k,summary:'🎒 School / co-op day',start:{date:k},end:{date:addDay(k,1)},recurringEventId:'s',extendedProperties:{private:{kind:'School'}}});
      if(w===0)out.push({id:'d'+k,summary:"👨‍👩‍👧‍👦 Dinner at Andrew's parents",start:{date:k},end:{date:addDay(k,1)},recurringEventId:'d',extendedProperties:{private:{kind:'Family'}}})}
    return {items:out.concat(demoEv)};
  }
  if(path.includes('/events')&&opt.method==='POST'){demoEv.push({...opt.body,id:'x'+Math.random()});return {}}
  if(path.includes('/events/')&&opt.method==='DELETE'){demoEv=demoEv.filter(e=>!path.includes(e.id));return null}
  return {};
}
async function init(){
  if(DEMO){me='demo@example.com';calId='demo';await load();return render()}
  const t=store.get('fc.tok');
  if(t&&t.tokenExp>Date.now()+60000){token=t.token;tokenExp=t.tokenExp;try{await bootstrap();await load()}catch(x){calId=null;err=x.message}}
  render();
}
init();
})();
</script>
</body>
</html>
